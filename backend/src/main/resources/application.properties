spring.application.name=backend
server.port=8081

# MySQL database settings
spring.datasource.url=jdbc:mysql://db:3306/rentalfarmtools?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=my_secure_password

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# optional, Hibernate auto-detects MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Ensure data.sql runs after Hibernate creates tables
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
# JWT secret key (must be the same for generation and validation)
# JWT secret must be at least 32 characters (256 bits)
jwt.secret=ThisIsASuperSecureSecretKeyForJWTSigning1234567890

# Reduce Spring Web logs
logging.level.org.springframework.web=INFO

# Suppress Hibernate SQL spam
logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=ERROR

# Show only warnings for Tomcat
logging.level.org.apache.catalina=ERROR

# Keep your own app logs visible
logging.level.com.rentalfarmtools.backend=DEBUG
