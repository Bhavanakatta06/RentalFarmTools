version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: rentalfarm_db
    restart: always
    environment:
      MYSQL_DATABASE: rentalfarmtools
      MYSQL_ROOT_PASSWORD: my_secure_password 
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: rentalfarm_backend
    restart: always
    ports:
      - "8081:8081"
    depends_on:
      - db
    environment:
      # This overrides your application.properties so it connects to the Docker MySQL
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/rentalfarmtools?allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=my_secure_password 
      - JWT_SECRET=your_super_secret_jwt_key_here

  frontend:
    build: ./frontend
    container_name: rentalfarm_frontend
    restart: always
    ports:
      - "80:80"  # Nginx serves on port 80
    depends_on:
      - backend

volumes:
  db_data: