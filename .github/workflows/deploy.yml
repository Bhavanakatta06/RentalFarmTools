name: ci/cd pipeline
on: 
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t rentalfarm_backend:latest ./backend
      - name: Build frontend image
        run: docker build -t rentalfarm_frontend:latest ./frontend

      - name: save Docker images
        run: |
          docker save rentalfarm_backend:latest |gzip > backend.tar.gz
          docker save rentalfarm_frontend:latest |gzip > frontend.tar.gz   
      #upload artifacts
      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: "*.tar.gz"

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: docker-images
          path: .

      - name: Copy files to GCP VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          source: "*.tar.gz,docker-compose.yml"
          target: "~/"

      # Load images and restart stack
      - name: Deploy with Docker Compose
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            docker load < backend.tar.gz
            docker load < frontend.tar.gz
            docker compose down || true
            docker compose up -d --force-recreate

      # Health check: frontend (public site)
      - name: Health check frontend
        run: |
          echo "Checking frontend at https://kattabhavana.dpdns.org..."
          curl -k --fail https://kattabhavana.dpdns.org || exit 1

      # Health check: backend API
      - name: Health check backend
        run: |
          echo "Checking backend at http://${{ secrets.GCP_HOST }}:8081/actuator/health..."
          curl --fail http://${{ secrets.GCP_HOST }}:8081/actuator/health || exit 1

      # Health check: database
      - name: Health check database
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            echo "Checking MySQL container..."
            docker exec rentalfarm_db mysqladmin ping -uroot -p${DB_PASSWORD}
